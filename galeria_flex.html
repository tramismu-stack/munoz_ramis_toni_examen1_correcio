<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1">
    <title>Rutes (Flexbox) · Bicis Tramuntana</title>
    <link rel="stylesheet" href="css/galeria_flex.css">
</head>

<body>
    <header>
        <h1>Bicis Tramuntana</h1>
        <p class="banner">Lloga la bici per a qualsevol d’aquestes rutes: 15 € el dia</p>
    </header>
    <main>
        <h2>Rutes en bici per Mallorca</h2>
        <div class="galeria">
            <figure>
                <img src="img/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la serra de Tramuntana">

                <figcaption>Sa Calobra <span class="km">38
                        km</span></figcaption>
            </figure>
            <figure>
                <img src="img/formentor.jpg" alt="El far de Formentor damunt dels penya-segats">
                <figcaption>Cap de Formentor <span class="km">42 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/valldemossa.jpg" alt="El poble de pedra de Valldemossa amb el campanar de la cartoixa">
                <figcaption>Valldemossa <span class="km">30
                        km</span></figcaption>
            </figure>
            <figure>
                <img src="img/port_soller.jpg" alt="La badia del Port de Sóller vista des de dalt">
                <figcaption>Port de Sóller <span class="km">25
                        km</span></figcaption>
            </figure>
            <figure>
                <img src="img/ametllers.jpg" alt="Ametllers florits en un camp amb parets de pedra seca">
                <figcaption>Els ametllers en flor <span class="km">35 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/es_trenc.jpg" alt="Platja d’arena blanca amb dunes i una passarel·la de fusta">
                <figcaption>Es Trenc <span class="km">28
                        km</span></figcaption>
            </figure>
            <figure>
                <img src="img/lluc.jpg" alt="El santuari de Lluc en una vall verda de muntanya">
                <figcaption>Santuari de Lluc <span class="km">45 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/pollenca.jpg" alt="Un pont de pedra amb arcs damunt d’un torrent, entre canyes">
                <figcaption>Pont romà de Pollença <span class="km">20 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/salines.jpg" alt="Les basses de sal de Ses Salines amb flamencs al fons">
                <figcaption>Ses Salines <span class="km">32
                        km</span></figcaption>
            </figure>
        </div>
    </main>
</body>

</html>
