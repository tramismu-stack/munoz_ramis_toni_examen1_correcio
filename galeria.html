<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/galeria.css">
    <title>Bicis Tramuntana</title>
</head>

<body>
    <header>
        <h1>Bicis Tramuntana</h1>
        <p class="banner">Lloga la bici per a qualsevol d'aquests rutes: 15€ el dia</p>
        <nav>
            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="contacte.html">Contacte</a></li>
                <li><a href="galeria.html">Galeria</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Rutes en bici per Mallorca</h2>
        <div class="galeria">   
            <figure>
                <img src="img/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la serra de Tramuntana">
                <figcaption>Sa Calobra <span class="km">· 38 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/formentor.jpg" alt="Carretera a prop del mar amb una finca i un faro">
                <figcaption>Cap de Formentor <span class="km">· 42 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/valldemossa.jpg" alt="Carretera de pedres a un poble">
                <figcaption>Valldemos <span class="km">· 30 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/port_soller.jpg" alt="Ruta amb un llac amb barcos en mig">
                <figcaption>Port de Sóller <span class="km">· 25 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/ametllers.jpg" alt="Carretera amb molt d'ametlers en flor amb una finca al fons">
                <figcaption>Els ametlles en Flor <span class="km">· 35 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/es_trenc.jpg" alt="Ruta a la platja amb montanyes al fons">
                <figcaption>Es Trenc <span class="km">· 28 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/lluc.jpg" alt="Ruta a les muntanyes a prop d'un monasteri">
                <figcaption> Santuari de Lluc <span class="km">· 45 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/pollenca.jpg" alt="Ruta amb un pont en mig d'un riu amb montanyes al fons">
                <figcaption>Pont romà de Pollença <span class="km">· 20 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/salines.jpg" alt="Ruta amb la platja en mig amb flamencos">
                <figcaption>Ses salines <span class="km">· 32 km</span></figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <h2>Horari d'obertura</h2>
        <ol>
            <li>Dilluns a divendres: 9 a 20</li>
            <li>Dissabte: 9 a 14</li>
            <li>Diumenge: tancat</li>
        </ol>
        <p>Fet per Joan Pons Mas</p>
    </footer>
</body>

</html>
